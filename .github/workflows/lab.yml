name: Build and test lab

# Builds firmware v1.0.0 and v2.0.0, runs the full workshop flow in QEMU
# (both signature schemes, valid and tampered updates), then commits the
# tested binaries so new Codespaces start with them.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "firmware/**"
      - ".devcontainer/**"
      - "tests/**"
      - "tools/**"
      - "*.sh"
      - ".github/workflows/lab.yml"

permissions:
  contents: write

jobs:
  firmware:
    runs-on: ubuntu-latest
    container: espressif/idf:v5.5.6
    steps:
      - uses: actions/checkout@v4
      - name: Build firmware
        shell: bash
        run: |
          . "$IDF_PATH/export.sh"
          bash firmware/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: lab-binaries
          path: |
            device/factory.bin
            updates/firmware_v2.bin
          if-no-files-found: error

  e2e:
    needs: firmware
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: lab-binaries
      - name: Build lab environment image
        run: docker build -t pqc-ota-lab-env .devcontainer
      - name: Run workshop flow in QEMU
        run: |
          cp device/factory.bin device/flash_image.bin
          docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp \
            -v "$PWD:/lab" -w /lab pqc-ota-lab-env bash tests/e2e_test.sh

  publish:
    needs: e2e
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: lab-binaries
      - name: Commit tested binaries
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f device/factory.bin updates/firmware_v2.bin
          if git diff --cached --quiet; then
            echo "Binaries unchanged"
          else
            git commit -m "Update tested lab binaries"
            git push
          fi
