name: Build and test lab

# Builds firmware v1.0.0 and v2.0.0, runs the full workshop flow in QEMU
# (both signature schemes, valid and tampered updates), then commits the
# tested binaries so new Codespaces start with them.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "firmware/**"
      - ".devcontainer/**"
      - "tests/**"
      - "tools/**"
      - "*.sh"
      - ".github/workflows/lab.yml"

permissions:
  contents: write

jobs:
  firmware:
    runs-on: ubuntu-latest
    container: espressif/idf:v5.5.6
    steps:
      - uses: actions/checkout@v4
      - name: Build firmware
        shell: bash
        run: |
          . "$IDF_PATH/export.sh"
          bash firmware/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: lab-binaries
          path: |
            device/factory.bin
            updates/firmware_v2.bin
          if-no-files-found: error
      - name: Publish debug symbols to ci-elf branch
        shell: bash
        run: |
          mkdir -p /tmp/ci-elf
          cp firmware/build_v1/pqc_ota_lab.elf /tmp/ci-elf/v1.elf
          cp firmware/build_v2/pqc_ota_lab.elf /tmp/ci-elf/v2.elf
          cp firmware/build_v1/bootloader/bootloader.elf /tmp/ci-elf/bootloader.elf
          cp firmware/sdkconfig /tmp/ci-elf/sdkconfig
          cd /tmp/ci-elf
          git init -q -b ci-elf
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Symbols for run ${{ github.run_id }}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" ci-elf

  e2e:
    needs: firmware
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: lab-binaries
      - name: Build lab environment image
        run: docker build -t pqc-ota-lab-env .devcontainer
      - name: Diagnostic boot of v2 from ota_0
        shell: bash
        run: |
          mkdir -p tests/out
          python3 - <<'PY'
          f = bytearray(open("device/factory.bin", "rb").read())
          v2 = open("updates/firmware_v2.bin", "rb").read()
          f[0x10000:0x190000] = v2 + b"\xff" * (0x180000 - len(v2))
          open("device/flash_image.bin", "wb").write(f)
          PY
          docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp -v "$PWD:/lab" -w /lab pqc-ota-lab-env \
            timeout 40 ./run_device.sh < /dev/null > tests/out/diag_v2_ota0.log 2>&1 || true
          tail -30 tests/out/diag_v2_ota0.log
      - name: Run workshop flow in QEMU
        shell: bash
        run: |
          cp device/factory.bin device/flash_image.bin
          docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp \
            -v "$PWD:/lab" -w /lab pqc-ota-lab-env bash tests/e2e_test.sh 2>&1 | tee tests/e2e_output.log
          exit "${PIPESTATUS[0]}"
      - name: Publish test logs to ci-logs branch
        if: always()
        run: |
          mkdir -p /tmp/ci-logs
          cp -r tests/out /tmp/ci-logs/ 2>/dev/null || true
          cp tests/e2e_output.log /tmp/ci-logs/ 2>/dev/null || true
          cd /tmp/ci-logs
          git init -q -b ci-logs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Test logs for run ${{ github.run_id }}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" ci-logs

  publish:
    needs: e2e
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: lab-binaries
      - name: Commit tested binaries
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f device/factory.bin updates/firmware_v2.bin
          if git diff --cached --quiet; then
            echo "Binaries unchanged"
          else
            git commit -m "Update tested lab binaries"
            git push
          fi
